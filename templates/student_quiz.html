<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập - {{ lesson.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .quiz-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        .quiz-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .question-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .question-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }
        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .option-item {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        .option-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .option-item input[type="radio"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .option-item input[type="radio"]:checked ~ .option-text {
            font-weight: 600;
            color: #667eea;
        }
        .option-item:has(input[type="radio"]:checked) {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .option-label {
            font-weight: 600;
            margin-right: 10px;
            min-width: 30px;
        }
        .timer {
            position: fixed;
            top: 80px;
            right: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            font-size: 1.2em;
            font-weight: bold;
            z-index: 1000;
        }
        .progress-bar-quiz {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            height: 5px;
            background: #e9ecef;
            z-index: 999;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        .submit-section {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 20px 0;
            margin-top: 30px;
            border-top: 2px solid #e9ecef;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); border-color: #667eea; }
        }
        @media (max-width: 768px) {
            .timer {
                position: static;
                margin-bottom: 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/student/dashboard">
                <i class="fas fa-graduation-cap me-2"></i>HỌC VUI
            </a>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div class="progress-bar-quiz">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <!-- Timer -->
    <div class="timer" id="timer">
        <i class="fas fa-clock me-2"></i>
        <span id="timeDisplay">00:00</span>
    </div>

    <div class="container my-4">
        <!-- Quiz Header -->
        <div class="quiz-header">
            <h3><i class="fas fa-clipboard-list me-2"></i>{{ lesson.title }}</h3>
            <p class="text-muted mb-0">
                <i class="fas fa-question-circle me-1"></i>
                {{ questions|length }} câu hỏi
            </p>
        </div>

        <!-- Quiz Form -->
        <form method="POST" id="quizForm">
            <div class="quiz-container">
                {% for question in questions %}
                {% set i = loop.index0 %}
                <div class="question-card" data-question="{{ i }}">
                    <div class="d-flex align-items-start mb-3">
                        <span class="question-number">{{ loop.index }}</span>
                        <div class="question-text flex-grow-1">{{ question.question }}</div>
                    </div>

                    <div class="options">
                        {% for option in ['A', 'B', 'C', 'D'] %}
                        <label class="option-item">
                            <input type="radio" name="q{{ i }}" value="{{ option }}" 
                                   onchange="updateProgress()">
                            <span class="option-label">{{ option }}.</span>
                            <span class="option-text flex-grow-1">{{ question[option] }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>

            <!-- Submit Section -->
            <div class="submit-section">
                <div class="container">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-muted">Đã trả lời: </span>
                            <span class="fw-bold" id="answeredCount">0</span>
                            <span class="text-muted">/ {{ questions|length }}</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="/student/lesson/{{ lesson.id }}" 
                               class="btn btn-secondary btn-lg">
                                <i class="fas fa-times me-2"></i>Hủy
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                <i class="fas fa-paper-plane me-2"></i>Nộp bài
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let startTime = Date.now();
        let totalQuestions = {{ questions|length }};

        // Timer
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timeDisplay').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        setInterval(updateTimer, 1000);

        // Update progress
        function updateProgress() {
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            const percentage = (answered / totalQuestions) * 100;
            
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('answeredCount').textContent = answered;

            // Enable submit button if all questions answered
            const submitBtn = document.getElementById('submitBtn');
            if (answered === totalQuestions) {
                submitBtn.classList.remove('btn-secondary');
                submitBtn.classList.add('btn-success');
                submitBtn.innerHTML = '<i class="fas fa-check me-2"></i>Nộp bài (Đã hoàn thành)';
            } else {
                submitBtn.classList.remove('btn-success');
                submitBtn.classList.add('btn-primary');
                submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Nộp bài';
            }
        }

        // Form submit confirmation
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            
            if (answered < totalQuestions) {
                if (!confirm(`Bạn mới trả lời ${answered}/${totalQuestions} câu. Bạn có chắc muốn nộp bài?`)) {
                    e.preventDefault();
                    return;
                }
            }

            // Show loading
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang chấm bài...';
        });

        // Warn before leaving
        window.addEventListener('beforeunload', function(e) {
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            if (answered > 0) {
                e.preventDefault();
                e.returnValue = 'Bạn có chắc muốn rời khỏi? Bài làm của bạn sẽ không được lưu.';
            }
        });

        // Scroll to first unanswered question
        function scrollToUnanswered() {
            const allQuestions = document.querySelectorAll('.question-card');
            for (let q of allQuestions) {
                const questionIndex = q.dataset.question;
                const answered = q.querySelector(`input[name="q${questionIndex}"]:checked`);
                if (!answered) {
                    q.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    q.style.animation = 'pulse 1s';
                    setTimeout(() => q.style.animation = '', 1000);
                    break;
                }
            }
        }

        // Auto-save to localStorage (optional)
        function saveAnswers() {
            const answers = {};
            document.querySelectorAll('input[type="radio"]:checked').forEach(input => {
                answers[input.name] = input.value;
            });
            localStorage.setItem('quiz_{{ lesson.id }}', JSON.stringify(answers));
        }

        // Load saved answers
        function loadAnswers() {
            const saved = localStorage.getItem('quiz_{{ lesson.id }}');
            if (saved) {
                const answers = JSON.parse(saved);
                for (let [name, value] of Object.entries(answers)) {
                    const input = document.querySelector(`input[name="${name}"][value="${value}"]`);
                    if (input) {
                        input.checked = true;
                    }
                }
                updateProgress();
            }
        }

        // Auto-save on answer change
        document.querySelectorAll('input[type="radio"]').forEach(input => {
            input.addEventListener('change', saveAnswers);
        });

        // Load on page load
        loadAnswers();
    </script>
</body>
</html>
